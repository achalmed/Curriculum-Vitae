# =============================================================================
# CI/CD — Compilación de los 6 perfiles del CV y publicación en Releases
# =============================================================================
# - En cada push a master y en cada pull request: compila los 6 perfiles
#   (verificación de que nada rompe la compilación) y los sube como artifact.
# - En cada tag v* (ej. v3.1.0): además publica los PDFs como GitHub Release.
#   Los PDFs NUNCA se versionan en el repositorio; se distribuyen por aquí.
# =============================================================================

name: Compilar CV

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar make
        run: apt-get update -qq && apt-get install -y -qq make

      - name: Compilar los 6 perfiles
        run: make all

      - name: Subir PDFs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: build/*.pdf
          retention-days: 30

      - name: Publicar Release con los PDFs (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pdf
          generate_release_notes: true
